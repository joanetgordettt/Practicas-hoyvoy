name: Vigilar web de prácticas

on:
  schedule:
    - cron: "*/20 * * * *"   # respaldo: si la cadena se parase, la reinicia
  workflow_dispatch:          # botón "Run workflow"

permissions:
  contents: write
  actions: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-v1
      - run: pip install playwright && playwright install --with-deps chromium

      - name: Vigilar la web (una comprobación cada minuto durante ~55 min)
        env:
          TARGET_URL: https://fke12wzwjp.zite.so
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          AVISAR_CADA_MIN: "5"   # cada cuántos minutos llega el correo de "Sin novedades"
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          while [ $SECONDS -lt 3300 ]; do
            echo "=== Comprobación $(date -u '+%H:%M:%S') UTC ==="
            git pull --rebase --autostash -q || true
            python monitor.py || echo "Esta comprobación ha fallado, se reintenta enseguida"
            git add state.json
            if ! git diff --cached --quiet; then
              git commit -q -m "Actualizar estado"
              git push -q || (git pull --rebase -q && git push -q) || true
            fi
            sleep 60   # segundos entre comprobaciones
          done

      - name: Lanzar el siguiente turno
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run monitor.yml --ref "${{ github.ref_name }}"
